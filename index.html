  <!-- Bootstrap: App starts immediately with local (IndexedDB / localStorage) data.
       Firebase setup runs in the background after all deferred scripts are ready.
       The firebase-sync loader overlay will appear if the user needs to authenticate
       or while initial cloud data is being fetched — but the UI is never blocked. -->
  <script type="module">
    // type="module" is implicitly deferred, so all <script defer> above have
    // already executed by the time this runs — Firebase SDK is guaranteed loaded.
    App.start();
    if (window.FirebaseSync) {
      FirebaseSync.setup()
        .then(function (ok) {
          // Once initial cloud data has merged in, re-render the current view so
          // data synced from another device shows without navigating away.
          // Skip if the user is actively typing in the notebook editor.
          var editing = document.activeElement && document.activeElement.closest && document.activeElement.closest('.nb-editor');
          if (ok && !editing) App.render();
        })
        .catch(function (e) { console.warn('Firebase setup error:', e); });
    }

    // רישום ה-Service Worker (PWA): מאפשר התקנה למסך הבית, טעינה מיידית,
    // ועבודה אופליין (הצגת הגרסה האחרונה שנשמרה). רץ אחרי טעינת העמוד.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (e) {
          console.warn('SW registration failed:', e);
        });
      });
    }
  </script>
