          '<button type="button" style="background:#fff;color:#1F5F8B;border:0;border-radius:7px;padding:6px 12px;font:700 13px Heebo,Arial,sans-serif;cursor:pointer">רענון</button>' +
          '<button type="button" aria-label="סגור" style="background:transparent;color:#fff;border:0;font-size:18px;cursor:pointer;line-height:1">×</button>';
        b.children[1].onclick = function () { location.reload(); };
        b.children[2].onclick = function () { b.remove(); };
        document.body.appendChild(b);
      }
      function check() {
        if (shown || !navigator.onLine || Date.now() - lastCheck < 60000) return;
        lastCheck = Date.now();
        fetchSig().then(function (sig) {
          if (!sig) return;
          if (baseline === null) { baseline = sig; return; }
          if (sig !== baseline) showBanner();
        });
      }
      window.addEventListener('load', function () { setTimeout(check, 4000); });
      setInterval(check, 5 * 60 * 1000);
      document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') check(); });
    })();
  </script>
</body>
</html>
